<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆市七堵區薔琵颱風災害派工彙整系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) 用於 Excel 匯入與匯出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Supabase：登入、雲端資料同步與照片儲存 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SortableJS 用於列拖曳排序 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Inter 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        /* 拖曳手柄視覺效果 */
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e2e8f0 !important;
        }
        /* 印表機/PDF 輸出優化設定 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .container-print {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            td, th {
                border: 1px solid #94a3b8 !important;
                padding: 6px 8px !important;
            }
            /* 針對派工地點 textarea 列印優化：自動適應高度與完整顯示文字 */
            textarea.print-expand {
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                border: none !important;
                padding: 0 !important;
                resize: none !important;
                white-space: pre-wrap !important;
                word-break: break-all !important;
                display: block !important;
            }
            .photo-del-btn {
                display: none !important;
            }
        }
    </style>
</head>

<body class="text-slate-800 antialiased min-h-screen">
    <div id="authGate" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-100 p-4">
        <form id="authForm" class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl">
            <div class="mb-5 text-center">
                <div class="mb-2 text-3xl">☁️</div>
                <h2 class="text-xl font-bold text-slate-900">災害派工雲端系統</h2>
                <p class="mt-2 text-sm text-slate-500">登入後即可跨裝置查看與共同更新資料</p>
            </div>
            <label class="mb-1 block text-sm font-medium text-slate-700" for="authEmail">電子郵件</label>
            <input id="authEmail" type="email" required autocomplete="username" class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-blue-500" placeholder="name@example.com">
            <label class="mb-1 block text-sm font-medium text-slate-700" for="authPassword">密碼</label>
            <input id="authPassword" type="password" required minlength="6" autocomplete="current-password" class="mb-4 w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-blue-500" placeholder="至少 6 個字元">
            <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2.5 font-semibold text-white hover:bg-slate-700">登入</button>
            <button id="signupButton" type="button" class="mt-2 w-full rounded-lg border border-slate-300 px-4 py-2.5 font-semibold text-slate-700 hover:bg-slate-50">建立帳號</button>
            <p id="authMessage" class="mt-3 min-h-5 text-sm text-rose-600" role="status"></p>
            <p class="mt-2 text-xs leading-5 text-slate-500">請使用已授權的工作帳號。若註冊後需驗證電子郵件，請先完成驗證再登入。</p>
        </form>
    </div>


    <div id="appRoot" class="hidden">
    <div id="photoLightbox" class="hidden fixed inset-0 z-[110] bg-black/90 p-4 flex items-center justify-center no-print" role="dialog" aria-modal="true" aria-label="照片放大檢視" onclick="closePhotoPreview()">
        <button type="button" class="absolute top-4 right-4 rounded-full bg-white/20 px-4 py-2 text-white hover:bg-white/30" onclick="closePhotoPreview()">✕ 關閉</button>
        <img id="photoLightboxImage" src="" alt="放大照片" class="max-h-[92vh] max-w-[96vw] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
    </div>
    <div id="historyModal" class="hidden fixed inset-0 z-[90] bg-slate-900/60 p-4 overflow-y-auto no-print" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
        <div class="mx-auto my-8 w-full max-w-5xl rounded-2xl bg-white shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between gap-4 bg-[#1e293b] px-5 py-4 text-white">
                <h2 id="historyModalTitle" class="text-lg font-bold">歷史資料</h2>
                <button type="button" onclick="closeHistoryModal()" class="rounded-lg px-3 py-1.5 hover:bg-slate-700" aria-label="關閉">✕ 關閉</button>
            </div>
            <div id="historyModalContent" class="p-5"><p class="text-sm text-slate-500">載入中…</p></div>
        </div>
    </div>
    <div class="container-print max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 頂部區塊：僅調整標題與工程控制區位置 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <div class="flex flex-col gap-4">
                <div class="flex flex-col xl:flex-row xl:items-start xl:justify-between gap-4">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline gap-2 flex-wrap">
                            <h1 id="mainTitle" contenteditable="true" onblur="saveTitle(this.innerText)" class="text-2xl sm:text-3xl font-extrabold text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-slate-50 rounded px-1 py-0.5 transition-all" title="點擊即可修改大標題">
                                基隆市七堵區薔琵颱風災害派工彙整
                            </h1>
                            <span class="text-xs text-amber-600 font-medium">✏️ 點擊標題可修改</span>
                        </div>
                    </div>
                    <div class="no-print flex flex-wrap items-center justify-start xl:justify-end gap-2">
                        <label for="projectSelect" class="text-sm font-semibold text-slate-600">目前工程</label>
                        <select id="projectSelect" onchange="switchProject(this.value)" class="max-w-xs rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"></select>
                        <button type="button" onclick="addProject()" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">＋ 新增工程</button>
                        <button type="button" onclick="renameProject()" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">✏️ 編輯工程名稱</button>
                        <button type="button" onclick="deleteProject()" class="rounded-lg border border-rose-300 bg-rose-50 px-3 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">🗑️ 刪除工程</button>
                    </div>
                </div>
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                    <div class="flex flex-wrap items-center gap-2 text-slate-500 text-xs sm:text-sm font-medium">
                        <span class="bg-blue-100 text-blue-700 font-semibold px-2.5 py-0.5 rounded-full">工程合約承辦人專用模板</span>
                        <span class="ml-2 inline-flex items-center gap-1 rounded-full bg-blue-50 px-2 py-0.5 text-blue-700" id="cloudStatusTag">雲端連線中…</span>
                        <button type="button" onclick="signOutCloud()" class="ml-2 rounded-md border border-slate-200 px-2 py-1 text-xs text-slate-600 hover:bg-slate-50 no-print">登出</button>
                        <span class="flex items-center gap-1 text-slate-400">
                            💾 <span id="saveTimeTag">最近更新時間：載入雲端時間中…</span>
                        </span>
                    </div>
                    <div class="no-print flex flex-wrap gap-3 items-center">
                        <button onclick="window.print()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#334155] hover:bg-[#1e293b] text-white rounded-xl font-medium text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-solid fa-print"></i>  列印
                        </button>
                        <label class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#475569] hover:bg-[#334155] text-white rounded-xl font-medium text-sm shadow-sm cursor-pointer transition-all active:scale-95">
                            <i class="fa-solid fa-upload"></i> 上傳
                            <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleFileUpload(event)">
                        </label>
                        <button onclick="exportToExcel()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-[#059669] hover:bg-[#047857] text-white rounded-xl font-semibold text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-solid fa-download"></i> 下載
                        </button>
                        <button onclick="archiveCurrentDispatch()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-semibold text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-solid fa-box-archive"></i> 結案
                        </button>
                        <button onclick="showHistory()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl font-semibold text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-solid fa-clock-rotate-left"></i> 歷史資料
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 統計卡片區 (依圖片三方格設定) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- 處理中派案 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between shadow-sm">
                <div>
                    <div class="text-xs font-semibold text-slate-500 mb-1">處理中派案</div>
                    <div id="stat-processing" class="text-3xl font-extrabold text-amber-600">0</div>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-500 text-xl font-bold">
                    ⚠️
                </div>
            </div>

            <!-- 已完成結案 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between shadow-sm">
                <div>
                    <div class="text-xs font-semibold text-slate-500 mb-1">已完成結案</div>
                    <div id="stat-completed" class="text-3xl font-extrabold text-emerald-600">0</div>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600 text-xl font-bold">
                    ✅
                </div>
            </div>

            <!-- 銷案 / 改派 / 免施工 -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between shadow-sm">
                <div>
                    <div class="text-xs font-semibold text-slate-500 mb-1">銷案 / 改派 / 免施工</div>
                    <div id="stat-closed" class="text-3xl font-extrabold text-rose-600">0</div>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500 text-xl font-bold">
                    🚫
                </div>
            </div>
        </div>

        <!-- 分頁頁籤與搜尋列區 -->
        <div class="no-print flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-3">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div id="vendorTabs" class="flex flex-wrap gap-2 overflow-x-auto pb-1"></div>
                <button type="button" onclick="addVendor()" class="shrink-0 rounded-lg border border-indigo-300 bg-indigo-50 px-3 py-2 text-xs font-semibold text-indigo-700 hover:bg-indigo-100">＋ 新增廠商</button>
                <button type="button" onclick="deleteVendor()" class="shrink-0 rounded-lg border border-rose-300 bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 hover:bg-rose-100">－ 刪除廠商</button>

                <!-- 搜尋輸入框 -->
                <div class="relative flex-1 sm:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜尋派工地點關鍵字..." class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all" />
                </div>
            </div>

            <!-- 排序提示 -->
            <div class="text-xs font-medium text-slate-500 flex items-center gap-1">
                <span>💡 提示：排序規則自動依 <strong class="text-amber-600">處理中</strong> ➔ <strong class="text-emerald-600">已完成</strong> ➔ <strong class="text-rose-600">銷案</strong> 排列</span>
            </div>
        </div>

        <!-- 暗色 Header 條與表格區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <!-- 暗藍色橫條 HeaderBar -->
            <div class="bg-[#1e293b] px-5 py-3.5 flex items-center justify-between no-print">
                <div class="flex items-center gap-2 text-white font-bold text-base">
                    <span>📋</span>
                    <span id="sectionHeaderTitle">全區派工總表</span>
                    <span id="sectionCountBadge" class="bg-slate-700 text-slate-200 text-xs px-2.5 py-0.5 rounded-full font-normal">共 0 筆紀錄</span>
                </div>
                <button onclick="addNewRecord()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-xs shadow-sm transition-all active:scale-95">
                    <i class="fa-solid fa-plus"></i> 新增臨時派案
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="mainTable">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3 text-center w-12 no-print">拖曳</th>
                            <th class="py-3 px-3 text-center w-14">序號</th>
                            <th class="py-3 px-3 w-28">廠商</th>
                            <th class="py-3 px-3 w-32">案件處理進度</th>
                            <th class="py-3 px-3 min-w-[240px]">派工地點</th>
                            <th class="py-3 px-3 w-56">Google Map 地圖位置</th>
                            <th class="py-3 px-3 min-w-[180px]">現況照片</th>
                            <th class="py-3 px-3 min-w-[180px]">完成照片</th>
                            <th class="py-3 px-3 text-center w-16 no-print">操作</th>
                        </tr>
                    </thead>
                    <tbody id="dispatchTable" class="divide-y divide-slate-200 text-sm">
                        <!-- 資料由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

        // 初始化：先驗證登入，再載入雲端資料。
        window.onload = async function() {
            loadLocalData();
            renderTables();
            if (!window.supabase || !window.supabase.createClient) {
                setAuthMessage("Supabase 程式載入失敗，請重新整理頁面或檢查網路。");
                return;
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
            document.getElementById("authForm").addEventListener("submit", handleSignIn);
            document.getElementById("signupButton").addEventListener("click", handleSignUp);

            const { data, error } = await supabaseClient.auth.getSession();
            if (error) {
                setAuthMessage("無法取得登入狀態：" + error.message);
                return;
            }
            if (data.session) {
                currentUser = data.session.user;
                await enterCloudApp();
            }
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === "SIGNED_IN" && session && !currentUser) {
                    currentUser = session.user;
                    await enterCloudApp();
                } else if (event === "SIGNED_OUT") {
                    currentUser = null;
                    document.getElementById("appRoot").classList.add("hidden");
                    document.getElementById("authGate").classList.remove("hidden");
                }
            });
        };

        function setAuthMessage(message, isError = true) {
            const el = document.getElementById("authMessage");
            if (!el) return;
            el.textContent = message || "";
            el.className = "mt-3 min-h-5 text-sm " + (isError ? "text-rose-600" : "text-emerald-700");
        }

        async function handleSignIn(event) {
            event.preventDefault();
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value;
            setAuthMessage("登入中…", false);
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) setAuthMessage("登入失敗：" + error.message);
            else setAuthMessage("登入成功，正在載入雲端資料…", false);
        }

        async function handleSignUp() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value;
            if (!email || password.length < 6) {
                setAuthMessage("請輸入有效電子郵件及至少 6 個字元的密碼。");
                return;
            }
            setAuthMessage("正在建立帳號…", false);
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) setAuthMessage("建立帳號失敗：" + error.message);
            else if (data.session) setAuthMessage("帳號建立成功，正在登入…", false);
            else setAuthMessage("帳號已建立。請先查看電子郵件完成驗證，再回到此頁登入。", false);
        }

        async function signOutCloud() {
            if (!confirm("確定要登出雲端系統嗎？")) return;
            if (cloudChannel) await supabaseClient.removeChannel(cloudChannel);
            await supabaseClient.auth.signOut();
        }

        async function enterCloudApp() {
            document.getElementById("authGate").classList.add("hidden");

                renderTables();

            }
        }

        function setCloudStatus(message, good = true) {
            const el = document.getElementById("cloudStatusTag");
            if (el) {
                el.textContent = message;
                el.className = "ml-2 inline-flex items-center gap-1 rounded-full px-2 py-0.5 " +
                    (good ? "bg-blue-50 text-blue-700" : "bg-rose-50 text-rose-700");
            }
        }

        async function loadCloudData() {
            const { data, error } = await supabaseClient.from("dispatch_projects")
                .select("id,name,title,items,vendors,version,updated_at,updated_by")
                .order("created_at", { ascending: true });
            if (error) throw error;
            projectList = data || [];
            if (!projectList.length) {
                // 相容既有版本：把原本單一 dispatch_state 資料轉成第一個工程。
                const { data: legacy, error: legacyError } = await supabaseClient.from("dispatch_state")
                    .select("title,items").eq("id", "main").maybeSingle();
                if (legacyError) throw legacyError;
                const savedItems = (() => { try { return JSON.parse(localStorage.getItem("typhoon_items") || "null"); } catch (_) { return null; } })();
                const title = (legacy && legacy.title) || localStorage.getItem("typhoon_title") || state.title;
                const items = (legacy && Array.isArray(legacy.items)) ? legacy.items : (savedItems || JSON.parse(JSON.stringify(DEFAULT_DATA)));
                const { data: created, error: createError } = await supabaseClient.from("dispatch_projects").insert({
                    name: "工程一", title, items, vendors: ['A廠商','B廠商'], updated_by: currentUser.id
                }).select("id,name,title,items,vendors,version,updated_at,updated_by").single();
                if (createError) throw createError;
                projectList = [created];
            }
            const preferred = projectList.find(p => p.name === localStorage.getItem("typhoon_project_name")) || projectList[0];
            currentProjectId = preferred.id;
            applyProjectRow(preferred);
            renderProjectSelector();
            setCloudStatus("雲端已同步");
        }

        function renderProjectSelector() {
            const el = document.getElementById('projectSelect');
            if (!el) return;
            el.innerHTML = projectList.map(p => `<option value="${p.id}" ${p.id === currentProjectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
        }

        function formatUpdateTime(value) {
            const el = document.getElementById('saveTimeTag');
            if (!el) return;
            if (!value) {
                el.innerText = '最近更新時間：尚無雲端紀錄';
                return;
            }
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                el.innerText = '最近更新時間：時間資料異常';
                return;
            }
            el.innerText = '最近更新時間：' + date.toLocaleString('zh-TW', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
        }

        function applyProjectRow(row) {
            if (!row) return;
            formatUpdateTime(row.updated_at);
            applyingRemoteChange = true;
            currentProjectId = row.id;
            currentProjectName = row.name || '未命名工程';
            cloudVersion = Number(row.version || 0);
            state.title = row.title || state.title;
            state.items = Array.isArray(row.items) ? row.items : [];
            state.vendors = Array.isArray(row.vendors) && row.vendors.length ? row.vendors : ['A廠商','B廠商'];
            sortDataByStatus();
            localStorage.setItem("typhoon_title", state.title);
            localStorage.setItem("typhoon_items", JSON.stringify(state.items));
            localStorage.setItem("typhoon_project_name", currentProjectName);
            const titleEl = document.getElementById("mainTitle");
            if (titleEl) titleEl.innerText = state.title;
            renderVendorTabs();
            applyingRemoteChange = false;
        }

        async function switchProject(projectId) {
            if (!projectId || projectId === currentProjectId) return;
            clearTimeout(cloudSaveTimer);
            // 切換前先儲存尚未送出的修改，避免把舊工程資料寫到新工程。
            if (supabaseClient && currentUser) {
                const saved = await saveCloudData();
                if (saved === false) {
                    document.getElementById('projectSelect').value = currentProjectId;
                    return;
                }
            }
            const project = projectList.find(p => p.id === projectId);
            if (!project) return;
            currentProjectId = projectId;
            applyProjectRow(project);
            state.currentTab = 'ALL';
            document.getElementById('projectSelect').value = projectId;
            renderVendorTabs();
            renderTables();
            setCloudStatus(`目前工程：${currentProjectName}`);
        }

        async function addProject() {
            if (!supabaseClient || !currentUser) return alert('請先登入雲端系統。');
            const name = prompt('請輸入新工程名稱：');
            if (!name || !name.trim()) return;
            const cleanName = name.trim();
            if (projectList.some(p => p.name.trim().toLowerCase() === cleanName.toLowerCase())) return alert('已有同名工程，請改用其他名稱。');
            const { data, error } = await supabaseClient.from('dispatch_projects').insert({
                name: cleanName, title: cleanName, items: [], vendors: [...state.vendors], updated_by: currentUser.id
            }).select('id,name,title,items,vendors,version,updated_at,updated_by').single();
            if (error) return alert('新增工程失敗：' + error.message + '\n請確認已執行新版 Supabase 升級 SQL。');
            projectList.push(data);
            renderProjectSelector();
            // 新工程直接切換，不先把舊工程狀態寫入新工程。
            currentProjectId = data.id;
            applyProjectRow(data);
            document.getElementById('projectSelect').value = data.id;
            state.currentTab = 'ALL';
            renderVendorTabs(); renderTables();
            setCloudStatus(`目前工程：${currentProjectName}`);
        }

        async function renameProject() {
            if (!currentProjectId || !supabaseClient || !currentUser) return alert('請先登入雲端系統。');
            const oldName = currentProjectName || '未命名工程';
            const input = prompt('請輸入新的工程名稱：', oldName);
            if (input === null) return;
            const name = input.trim();
            if (!name) return alert('工程名稱不可空白。');
            if (name.toLowerCase() !== oldName.toLowerCase() && projectList.some(p => p.id !== currentProjectId && p.name.trim().toLowerCase() === name.toLowerCase())) return alert('已有同名工程，請改用其他名稱。');
            const { data, error } = await supabaseClient.from('dispatch_projects').update({name, updated_at: new Date().toISOString(), updated_by: currentUser.id}).eq('id', currentProjectId).select('id,name,title,items,vendors,version,updated_at,updated_by').single();
            if (error) return alert('修改工程名稱失敗：' + error.message);
            currentProjectName = data.name;
            const idx = projectList.findIndex(p => p.id === data.id);
            if (idx >= 0) projectList[idx] = data;
            localStorage.setItem('typhoon_project_name', currentProjectName);
            renderProjectSelector();
            formatUpdateTime(data.updated_at);
            setCloudStatus('工程名稱已更新');
        }

        async function deleteProject() {
            if (!supabaseClient || !currentUser || !currentProjectId) return alert('請先登入雲端系統。');
            if (projectList.length <= 1) return alert('至少需保留一個工程，無法刪除最後一個工程。');
            const project = projectList.find(p => p.id === currentProjectId);
            if (!project) return;
            if (!confirm(`確定刪除工程「${project.name}」？\n\n此操作會永久刪除該工程目前的派案資料，且無法復原。此工程已結案的歷史紀錄不會自動刪除。`)) return;
            clearTimeout(cloudSaveTimer);
            const { error } = await supabaseClient.from('dispatch_projects').delete().eq('id', currentProjectId);
            if (error) return alert('刪除工程失敗：' + error.message);
            projectList = projectList.filter(p => p.id !== currentProjectId);
            const next = projectList[0];
            currentProjectId = next.id;
            applyProjectRow(next);
            renderProjectSelector();
            document.getElementById('projectSelect').value = next.id;
            state.currentTab = 'ALL';
            renderVendorTabs(); renderTables();
            setCloudStatus(`已刪除工程，切換至：${currentProjectName}`);
        }

        function subscribeCloudChanges() {
            if (cloudChannel) supabaseClient.removeChannel(cloudChannel);
            cloudChannel = supabaseClient.channel("dispatch-projects-live")
                .on("postgres_changes", { event: "*", schema: "public", table: "dispatch_projects" }, payload => {
                    const row = payload.new;
                    if (row && row.id === currentProjectId && row.updated_by !== (currentUser && currentUser.id)) {
                        applyProjectRow(row);
                        renderTables();
                        setCloudStatus("已接收其他使用者更新");
                    }
                    supabaseClient.from('dispatch_projects').select('id,name,title,items,vendors,version,updated_at,updated_by').order('created_at', {ascending:true})
                        .then(({data}) => { if (data) { projectList = data; renderProjectSelector(); } });
                })
                .subscribe(status => { if (status === "SUBSCRIBED") setCloudStatus("雲端已連線"); });
        }

        // 載入 localStorage 資料
        function loadLocalData() {
            const savedTitle = localStorage.getItem('typhoon_title');
            if (savedTitle) {
                state.title = savedTitle;
                document.getElementById('mainTitle').innerText = savedTitle;
            }

            const savedItems = localStorage.getItem('typhoon_items');
            if (savedItems) {
                try {
                    state.items = JSON.parse(savedItems);
                } catch(e) {
                    state.items = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                state.items = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
            state.vendors = ['A廠商','B廠商'];
            sortDataByStatus();
            renderVendorTabs();
        }

        // 依進度排序：處理中 > 已完成 > 銷案
        function sortDataByStatus() {
            const priority = { '處理中': 1, '已完成': 2, '銷案': 3 };
            state.items.sort((a, b) => {
                const pA = priority[a.status] || 99;
                const pB = priority[b.status] || 99;
                return pA - pB;
            });
        }

        // 本機快取 + 雲端儲存。雲端使用版本號避免靜默覆蓋其他使用者的更新。
        function saveData() {
            localStorage.setItem('typhoon_title', state.title);
            localStorage.setItem('typhoon_items', JSON.stringify(state.items));

            // 不在本機編輯時提前更新時間；顯示時間必須以雲端成功寫入的 updated_at 為準。
            if (!supabaseClient || !currentUser || applyingRemoteChange) return;
            clearTimeout(cloudSaveTimer);
            setCloudStatus("有變更，等待雲端儲存…");
            cloudSaveTimer = setTimeout(saveCloudData, 650);
        }

        async function saveCloudData() {
            if (!supabaseClient || !currentUser || applyingRemoteChange) return;
            const expectedVersion = cloudVersion;
            const { data, error } = await supabaseClient.rpc("save_dispatch_project", {
                p_project_id: currentProjectId,
                p_name: currentProjectName,
                p_title: state.title,
                p_items: state.items,
                p_vendors: state.vendors,
                p_expected_version: expectedVersion
            });
            if (error) {
                console.error("Cloud save failed:", error);
                setCloudStatus("同步衝突／儲存失敗", false);
                alert("雲端儲存未完成，可能是另一位使用者同時更新了資料。系統將重新載入雲端最新版本；請確認剛才的修改後再重新輸入。\\n" + error.message);
                try {
                    const latest = await supabaseClient.from("dispatch_projects")
                        .select("id,name,title,items,vendors,version,updated_at,updated_by").eq("id", currentProjectId).single();
                    if (!latest.error) {
                        applyProjectRow(latest.data);
                        renderTables();
                    }
                } catch (e) { console.error(e); }
                return false;
            }
            const savedRow = Array.isArray(data) ? data[0] : data;
            cloudVersion = Number(savedRow?.version || cloudVersion + 1);
            const idx = projectList.findIndex(p => p.id === currentProjectId);
            if (idx >= 0) projectList[idx] = { ...projectList[idx], title: state.title, items: state.items, vendors: state.vendors, version: cloudVersion, updated_at: savedRow?.updated_at || projectList[idx].updated_at, updated_by: currentUser.id };
            if (savedRow?.updated_at) formatUpdateTime(savedRow.updated_at);
            setCloudStatus("雲端已同步");
            return true;
        }

        async function deleteVendor() {
            const vendors = [...new Set(state.vendors || [])];
            if (!vendors.length) return alert('目前沒有可刪除的廠商。');
            const menu = vendors.map((v, i) => `${i + 1}. ${v}`).join('\n');
            const answer = prompt(`請輸入要刪除的廠商編號：\n\n${menu}\n\n注意：已被派案資料使用的廠商不能直接刪除。`);
            if (answer === null) return;
            const index = Number(answer) - 1;
            if (!Number.isInteger(index) || index < 0 || index >= vendors.length) return alert('廠商編號無效。');
            const vendor = vendors[index];
            if (state.items.some(item => item.vendor === vendor)) return alert(`「${vendor}」仍有派案資料使用，為避免資料遺失，請先將相關派案改派至其他廠商或移除該派案，再刪除此廠商。`);

            if (state.currentTab === vendor) state.currentTab = 'ALL';

        // 將照片縮至長邊 1600px、JPEG 品質 0.78，降低雲端儲存用量。
        async function compressImageFile(file) {
            if (!file.type.startsWith('image/')) return file;
            let bitmap;
            try { bitmap = await createImageBitmap(file); }
            catch (err) { console.warn('Browser cannot decode this image for compression; uploading original file.', err); return file; }
            const maxSide = 1600;
            const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(bitmap.width * scale));
            canvas.height = Math.max(1, Math.round(bitmap.height * scale));
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close && bitmap.close();
            const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('照片壓縮失敗')), 'image/jpeg', 0.78));
            const base = file.name.replace(/\.[^.]+$/, '') || 'photo';
            return new File([blob], `${base}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
        }

        async function openPhotoPreview(source) {
            const modal = document.getElementById('photoLightbox');
            const image = document.getElementById('photoLightboxImage');
            modal.classList.remove('hidden');
            image.src = '';
            if (source && typeof source === 'object') {
                const path = source.getAttribute('data-storage-path');
                if (path && supabaseClient) {
                    const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrl(path, 3600);
                    if (error || !data || !data.signedUrl) {
                        modal.classList.add('hidden');
                        alert('無法載入照片，請確認登入狀態及雲端照片權限。');
                        return;
                    }
                    image.src = data.signedUrl;
                    return;
                }
                image.src = source.currentSrc || source.src || '';
            } else {
                image.src = source || '';
            }
            if (!image.src || image.src === window.location.href) modal.classList.add('hidden');
        }
        function closePhotoPreview() {
            document.getElementById('photoLightbox').classList.add('hidden');
            document.getElementById('photoLightboxImage').src = '';
        }

        // 照片壓縮後上傳至 Supabase Storage（保留舊版 Base64 照片相容顯示）。
        async function uploadPhotos(id, type, event) {
            const files = Array.from(event.target.files || []);
            event.target.value = "";
            if (!files.length) return;
            const item = state.items.find(i => i.id === id);
            if (!item) return;
            if (!supabaseClient || !currentUser) {
                alert("請先登入雲端系統再上傳照片。");
                return;
            }

            try {
                for (const originalFile of files) {
                    if (!originalFile.type.startsWith("image/")) continue;
                    const file = await compressImageFile(originalFile);
                    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
                    const path = `${currentUser.id}/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}`;
                    const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, file, {
                        cacheControl: "3600", upsert: false, contentType: file.type
                    });
                    if (error) throw error;
                    const storedPath = "storage://" + path;
                    if (type === "before") {
                        item.beforePhotos = item.beforePhotos || [];
                        item.beforePhotos.push(storedPath);
                    } else {
                        item.afterPhotos = item.afterPhotos || [];
                        item.afterPhotos.push(storedPath);
                    }
                }
                saveData();
                renderTables();
            } catch (err) {
                console.error(err);
                alert("照片上傳失敗：" + (err.message || err));
            }
        }

        async function loadPhotoPreviews() {
            if (!supabaseClient || !currentUser) return;
            const images = document.querySelectorAll('img[data-storage-path]');
            for (const img of images) {
                const path = img.getAttribute("data-storage-path");
                if (!path || img.dataset.loading === "1") continue;
                img.dataset.loading = "1";
                const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrl(path, 3600);
                if (!error && data && data.signedUrl && img.isConnected) img.src = data.signedUrl;
                else if (error) console.warn("Photo preview unavailable:", error.message);
            }
        }

        // 刪除單張照片；雲端照片檔案也一併刪除。
        async function deletePhoto(id, type, pIdx) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;
            const arr = type === "before" ? item.beforePhotos : item.afterPhotos;
            if (!arr || !arr[pIdx]) return;
            const photo = arr[pIdx];
            if (String(photo).startsWith("storage://")) {
                const path = String(photo).slice(10);
                const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).remove([path]);
                if (error) {
                    alert("雲端照片刪除失敗：" + error.message);
                    return;
                }
            }
            arr.splice(pIdx, 1);
            saveData();
            renderTables();
        }

        // 結案：將當前所有派案存入雲端歷史資料，再清空首頁派案。
        async function archiveCurrentDispatch() {
            if (!state.items.length) {
                alert("目前沒有可結案的派案資料。");
                return;
            }
            const count = state.items.length;
            if (!confirm(`確定將本次全部 ${count} 筆派案存入「歷史資料」，並清空首頁派案資料嗎？此動作無法自動復原。`)) return;
            if (!supabaseClient || !currentUser) {
                alert("請先登入雲端系統再執行結案。");
                return;
            }
            const snapshot = JSON.parse(JSON.stringify(state.items));
            const { error: archiveError } = await supabaseClient.from("dispatch_history").insert({
                title: `${currentProjectName || '工程'}｜${state.title}`,
                items: snapshot,
                closed_by: currentUser.id
            });
            if (archiveError) {
                console.error("Archive failed:", archiveError);
                alert("歷史資料儲存失敗，首頁派案尚未清空。請確認已執行新增歷史資料表的 SQL 設定。\n" + archiveError.message);
                return;
            }
            state.items = [];
            saveData();
            clearTimeout(cloudSaveTimer);
            const cleared = await saveCloudData();
            renderTables();
            if (!cleared) {
                alert("歷史資料已保存，但首頁清空同步失敗。請重新整理確認雲端狀態，避免重複結案。" );
                return;
            }
            setCloudStatus("結案完成，首頁已清空");
            alert(`已將 ${count} 筆派案存入歷史資料，首頁派案已清空。`);
        }

        async function showHistory() {
            const modal = document.getElementById("historyModal");
            const content = document.getElementById("historyModalContent");
            modal.classList.remove("hidden");
            content.innerHTML = '<p class="text-sm text-slate-500">正在載入歷史資料…</p>';
            if (!supabaseClient || !currentUser) {
                content.innerHTML = '<p class="text-sm text-rose-600">請先登入雲端系統。</p>';
                return;
            }
            const { data, error } = await supabaseClient.from("dispatch_history")
                .select("id,title,items,closed_at,closed_by")
                .order("closed_at", { ascending: false });
            if (error) {
                console.error("History load failed:", error);
                content.innerHTML = '<p class="text-sm text-rose-600">歷史資料載入失敗。請確認已執行新增歷史資料表的 SQL 設定。</p>';
                return;
            }
            if (!data || !data.length) {
                content.innerHTML = '<p class="py-8 text-center text-sm text-slate-500">目前沒有歷史結案資料。</p>';
                return;
            }
            content.innerHTML = data.map(batch => {
                const dt = batch.closed_at ? new Date(batch.closed_at).toLocaleString('zh-TW', { hour12: false }) : '時間不詳';
                const count = Array.isArray(batch.items) ? batch.items.length : 0;
                return `<div class="mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 rounded-xl border border-slate-200 p-4">
                    <div><div class="font-semibold text-slate-800">${escapeHtml(batch.title || '派工歷史資料')}</div><div class="mt-1 text-xs text-slate-500">結案時間：${escapeHtml(dt)}　｜　共 ${count} 筆</div></div>
                    <div class="flex shrink-0 flex-wrap gap-2">
                        <button type="button" onclick="viewHistoryBatch('${batch.id}')" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white hover:bg-violet-700">查看明細</button>
                        <button type="button" onclick="downloadHistoryBatchExcel('${batch.id}')" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-700">下載 Excel</button>
                        <button type="button" onclick="deleteHistoryBatch('${batch.id}')" class="rounded-lg bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700">刪除</button>
                    </div>
                </div>`;
            }).join('');
        }


        // 刪除歷史批次並清理不再被目前工程或其他歷史批次引用的雲端照片。
        async function deleteHistoryBatch(batchId) {
            if (!confirm('確定刪除此筆歷史結案資料？若照片沒有被其他工程或歷史資料引用，也會同步從雲端 Storage 刪除。此操作無法復原。')) return;
            const { data: batch, error: readError } = await supabaseClient.from('dispatch_history').select('id,items').eq('id', batchId).single();
            if (readError || !batch) return alert('無法讀取歷史資料，未執行刪除。' + (readError ? '\n' + readError.message : ''));
            const paths = [];
            (batch.items || []).forEach(item => ['beforePhotos','afterPhotos'].forEach(k => (item[k] || []).forEach(photo => {
                if (String(photo).startsWith('storage://')) paths.push(String(photo).slice(10));
            })));
            const { error: deleteError } = await supabaseClient.from('dispatch_history').delete().eq('id', batchId);
            if (deleteError) return alert('歷史資料刪除失敗：' + deleteError.message);
            let candidates = [...new Set(paths)];
            try {
                const { data: active } = await supabaseClient.from('dispatch_projects').select('items');
                const { data: history } = await supabaseClient.from('dispatch_history').select('items');
                const referenced = new Set();
                const scan = arr => (arr || []).forEach(item => ['beforePhotos','afterPhotos'].forEach(k => (item[k] || []).forEach(photo => { if (String(photo).startsWith('storage://')) referenced.add(String(photo).slice(10)); })));
                (active || []).forEach(row => scan(row.items)); (history || []).forEach(row => scan(row.items));
                candidates = candidates.filter(path => !referenced.has(path));
            } catch (e) { console.warn('Could not scan remaining photo references; leaving storage files untouched.', e); candidates = []; }
            let failed = [];
            for (let i = 0; i < candidates.length; i += 100) {
                const batchPaths = candidates.slice(i, i + 100);
                const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).remove(batchPaths);
                if (error) failed.push(...batchPaths);
            }
            await showHistory();
            if (failed.length) alert('歷史資料已刪除，但有部分雲端照片未能刪除。請至 Supabase Storage 檢查權限或手動清理。');
            else alert('歷史資料已刪除；未被其他資料引用的雲端照片亦已清理。');
        }

        // 下載單次結案歷史資料為 Excel，欄位格式沿用首頁既有匯出功能。
        async function downloadHistoryBatchExcel(batchId) {
            if (typeof XLSX === 'undefined') {
                alert('Excel 匯出元件尚未載入，請重新整理網頁後再試。');
                return;
            }
            const { data, error } = await supabaseClient.from("dispatch_history")
                .select("id,title,items,closed_at")
                .eq("id", batchId).single();
            if (error || !data) {
                alert('無法載入這批歷史資料，請稍後再試。');
                return;
            }

            const items = Array.isArray(data.items) ? data.items : [];
            const wb = XLSX.utils.book_new();
            const createHistorySheetData = (rows) => {
                const headers = ['序號', '廠商', '案件處理進度', '派工地點', 'Google Map地圖位置', '現況照片', '完成照片'];
                const values = rows.map((item, idx) => {
                    const rawMap = String(item.map || '');
                    const mapUrl = /^https?:\/\//i.test(rawMap)
                        ? rawMap
                        : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rawMap)}`;
                    const safeUrl = mapUrl.replace(/"/g, '""');
                    const safeLabel = rawMap.replace(/"/g, '""');
                    return [
                        idx + 1,
                        item.vendor || '',
                        item.status || '',
                        item.location || '',
                        rawMap ? { f: `HYPERLINK("${safeUrl}", "${safeLabel}")` } : '',
                        item.beforePhotos && item.beforePhotos.length ? `[已上傳 ${item.beforePhotos.length} 張]` : '',
                        item.afterPhotos && item.afterPhotos.length ? `[已上傳 ${item.afterPhotos.length} 張]` : ''
                    ];
                });
                return [headers, ...values];
            };
            const allWs = XLSX.utils.aoa_to_sheet(createHistorySheetData(items));
            const vendors = [...new Set(items.map(i => i.vendor).filter(Boolean))];
            const vendorSheets = vendors.map(v => [v, XLSX.utils.aoa_to_sheet(createHistorySheetData(items.filter(i => i.vendor === v)))]);
            const colWidths = [{ wch: 6 }, { wch: 10 }, { wch: 14 }, { wch: 45 }, { wch: 35 }, { wch: 16 }, { wch: 16 }];
            allWs['!cols'] = colWidths;
            vendorSheets.forEach(([v, ws]) => ws['!cols'] = colWidths);
            XLSX.utils.book_append_sheet(wb, allWs, '全區派工總表');
            vendorSheets.forEach(([v, ws]) => XLSX.utils.book_append_sheet(wb, ws, v.replace(/[\\/?*\[\]:]/g, '_').slice(0,31) || '廠商'));
            const datePart = data.closed_at ? new Date(data.closed_at).toLocaleDateString('sv-SE') : new Date().toLocaleDateString('sv-SE');
            const safeTitle = String(data.title || '派工歷史資料').replace(/[\\/:*?"<>|]/g, '_');
            XLSX.writeFile(wb, `${safeTitle}_結案歷史_${datePart}.xlsx`);
        }

        function renderHistoryPhotos(photos) {
            return `<div class="flex min-w-[100px] flex-wrap gap-1">${(photos || []).map(photo => {
                const storage = String(photo).startsWith('storage://');
                return `<img src="${storage ? '' : photo}" data-storage-path="${storage ? escapeHtml(String(photo).slice(10)) : ''}" onclick="openPhotoPreview(this)" title="點擊放大檢視" class="h-12 w-12 cursor-zoom-in rounded border border-slate-200 object-cover" alt="派案照片">`;
            }).join('')}</div>`;
        }

        async function viewHistoryBatch(batchId) {
            const content = document.getElementById("historyModalContent");
            content.innerHTML = '<p class="text-sm text-slate-500">正在載入明細…</p>';
            const { data, error } = await supabaseClient.from("dispatch_history")
                .select("id,title,items,closed_at")
                .eq("id", batchId).single();
            if (error || !data) {
                content.innerHTML = '<p class="text-sm text-rose-600">無法載入這批歷史明細。</p>';
                return;
            }
            const dt = data.closed_at ? new Date(data.closed_at).toLocaleString('zh-TW', { hour12: false }) : '時間不詳';
            const items = Array.isArray(data.items) ? data.items : [];
            content.innerHTML = `<div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h3 class="font-bold text-slate-900">${escapeHtml(data.title || '派工歷史資料')}</h3><p class="mt-1 text-xs text-slate-500">結案時間：${escapeHtml(dt)}　｜　共 ${items.length} 筆</p></div><button type="button" onclick="showHistory()" class="rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50">返回歷史清單</button></div>
                <div class="overflow-x-auto"><table class="w-full border-collapse text-left text-sm"><thead><tr class="bg-slate-100 text-slate-700"><th class="p-2">序號</th><th class="p-2">廠商</th><th class="p-2">案件處理進度</th><th class="p-2">派工地點</th><th class="p-2">Google Map 地圖位置</th><th class="p-2">現況照片</th><th class="p-2">完成照片</th></tr></thead><tbody>${items.map((item, i) => `<tr class="border-b border-slate-200"><td class="p-2">${i + 1}</td><td class="p-2">${escapeHtml(item.vendor || '')}</td><td class="p-2">${escapeHtml(item.status || '')}</td><td class="p-2 whitespace-pre-wrap">${escapeHtml(item.location || '')}</td><td class="p-2 break-all">${escapeHtml(item.map || '')}</td><td class="p-2">${renderHistoryPhotos(item.beforePhotos)}</td><td class="p-2">${renderHistoryPhotos(item.afterPhotos)}</td></tr>`).join('')}</tbody></table></div>`;
            loadPhotoPreviews();
        }

        function closeHistoryModal() {
            document.getElementById("historyModal").classList.add("hidden");
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 欄位更動事件 handler
        function updateVendor(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.vendor = val; if (!state.vendors.includes(val)) state.vendors.push(val); renderVendorTabs(); saveData(); updateStats(); }
        }

        function updateStatus(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { 
                item.status = val; 
                sortDataByStatus();
                saveData(); 
                renderTables(); 
            }
        }

        function updateLocation(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.location = val; saveData(); }
        }

        function updateMap(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.map = val; saveData(); renderTables(); }
        }

        function deleteRecord(id) {
            if (confirm('確定要刪除這筆派工紀錄嗎？')) {
                state.items = state.items.filter(i => i.id !== id);
                saveData();
                renderTables();
            }
        }

        function addNewRecord() {
            const newId = 'new-' + Date.now();
            const newItem = {
                id: newId,
                vendor: state.currentTab !== 'ALL' ? state.currentTab : ((state.vendors && state.vendors[0]) || 'A廠商'),
                status: '處理中',
                location: '新派工地點',
                map: '基隆市七堵區',
                beforePhotos: [],
                afterPhotos: []
            };
            state.items.unshift(newItem);
            saveData();
            renderTables();
        }

        // 初始化拖曳排序
        function initSortable() {
            const tbody = document.getElementById('dispatchTable');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(tbody, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function(evt) {
                    const displayData = getFilteredData();
                    const movedItem = displayData[evt.oldIndex];
                    displayData.splice(evt.oldIndex, 1);
                    displayData.splice(evt.newIndex, 0, movedItem);

                    if (state.currentTab === 'ALL' && !state.searchQuery) {
                        state.items = displayData;
                    } else {
                        // 在篩選狀態下更新排序邏輯
                        const displayIds = new Set(displayData.map(i => i.id));
                        const otherItems = state.items.filter(i => !displayIds.has(i.id));
                        state.items = [...displayData, ...otherItems];
                    }
                    saveData();
                    renderTables();
                }
            });
        }

        // 匯出 Excel (包含 全區總表/A廠商/B廠商 三個工作表)
        function exportToExcel() {
            const wb = XLSX.utils.book_new();

            const createSheetData = (items) => {
                const headers = ['序號', '廠商', '案件處理進度', '派工地點', 'Google Map地圖位置', '現況照片', '完成照片'];
                const rows = items.map((item, idx) => {
                    let mapUrl = item.map;
                    if (!item.map.startsWith('http://') && !item.map.startsWith('https://')) {
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}`;
                    }
                    return [
                        idx + 1,
                        item.vendor,
                        item.status,
                        item.location,
                        { f: `HYPERLINK("${mapUrl}", "${item.map}")` },
                        item.beforePhotos && item.beforePhotos.length ? `[已上傳 ${item.beforePhotos.length} 張]` : '',
                        item.afterPhotos && item.afterPhotos.length ? `[已上傳 ${item.afterPhotos.length} 張]` : ''
                    ];
                });
                return [headers, ...rows];
            };

            const allWs = XLSX.utils.aoa_to_sheet(createSheetData(state.items));
            const vendorSheets = (state.vendors || ['A廠商','B廠商']).map(v => [v, XLSX.utils.aoa_to_sheet(createSheetData(state.items.filter(i => i.vendor === v)))]);

            const colWidths = [{ wch: 6 }, { wch: 10 }, { wch: 14 }, { wch: 45 }, { wch: 35 }, { wch: 16 }, { wch: 16 }];
            allWs['!cols'] = colWidths;
            vendorSheets.forEach(([v, ws]) => ws['!cols'] = colWidths);

            XLSX.utils.book_append_sheet(wb, allWs, '全區派工總表');
            vendorSheets.forEach(([v, ws]) => XLSX.utils.book_append_sheet(wb, ws, v.replace(/[\\/?*\[\]:]/g, '_').slice(0,31) || '廠商'));

            XLSX.writeFile(wb, `${state.title}.xlsx`);
        }

        // 上傳 Excel 匯入檔案更新網頁內容
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    // 設定 cellFormula/cellText 等以完整抓取公式與超連結 content
                    const workbook = XLSX.read(data, { type: 'array', cellFormula: true, cellHTML: true, cellStyles: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });

                    if (jsonData.length < 2) {
                        alert('無效的 Excel 內容');
                        return;
                    }

                    const newItems = [];
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length === 0) continue;

                        // 取出地圖欄位 (索引 4) 精確解析：支援 Hyperlink 標籤、HYPERLINK 公式、純文字位址與座標
                        let mapVal = '';
                        const cellAddress = XLSX.utils.encode_cell({ r: i, c: 4 });
                        const cell = worksheet[cellAddress];

                        if (cell) {
                            // 1. 優先檢查是否為 Excel Native 儲存格超連結對象
                            if (cell.l && cell.l.Target) {
                                mapVal = cell.l.Target;
                            } 
                            // 2. 若為 HYPERLINK("url", "text") 公式，解析公式中的 URL 或文字
                            else if (cell.f && cell.f.includes('HYPERLINK')) {
                                const match = cell.f.match(/HYPERLINK\s*\(\s*"([^"]+)"(?:\s*,\s*"([^"]+)")?\s*\)/i);
                                if (match) {
                                    mapVal = match[2] || match[1] || '';
                                }
                            }
                            
                            // 3. 取單元格顯示值或內容 (支援填寫座標如 "25.101,121.710" 或實際地址)
                            if (!mapVal) {
                                mapVal = cell.w ? String(cell.w).trim() : (cell.v !== undefined ? String(cell.v).trim() : '');
                            }
                        }

                        // 4. Fallback: 取 row 陣列的值
                        if (!mapVal && row[4] !== undefined && row[4] !== null) {
                            mapVal = String(row[4]).trim();
                        }

                        newItems.push({
                            id: 'imp-' + Date.now() + '-' + i,
                            vendor: row[1] ? String(row[1]).trim() : 'B廠商',
                            status: row[2] ? String(row[2]).trim() : '處理中',
                            location: row[3] ? String(row[3]).trim() : '',
                            map: mapVal || '',
                            beforePhotos: [],
                            afterPhotos: []
                        });
                    }

                    if (newItems.length > 0) {
                        state.items = newItems;
                        newItems.forEach(item => { if (item.vendor && !state.vendors.includes(item.vendor)) state.vendors.push(item.vendor); });
                        sortDataByStatus();
                        renderVendorTabs();
                        saveData();
                        renderTables();
                        alert(`成功匯入 ${newItems.length} 筆案件！`);
                    }
                } catch (err) {
                    alert('讀取 Excel 檔案失敗，請檢查檔案格式。');
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
    </div><!-- /appRoot -->
