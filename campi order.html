        let state = {
            title: '基隆市七堵區薔琵颱風災害派工彙整表',
            currentTab: 'ALL', // 'ALL', 'A', 'B'
            searchQuery: '',
            items: []
        };

        let sortableInstance = null;

        // 初始化
        window.onload = function() {
            loadLocalData();
            renderTables();
        };

        // 載入 localStorage 資料
        function loadLocalData() {
            const savedTitle = localStorage.getItem('typhoon_title');
            if (savedTitle) {
                state.title = savedTitle;
                document.getElementById('mainTitle').innerText = savedTitle;
            }

            const savedItems = localStorage.getItem('typhoon_items');
            if (savedItems) {
                try {
                    state.items = JSON.parse(savedItems);
                } catch(e) {
                    state.items = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                state.items = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
            sortDataByStatus();
        }

        // 依進度排序：處理中 > 已完成 > 銷案
        function sortDataByStatus() {
            const priority = { '處理中': 1, '已完成': 2, '銷案': 3 };
            state.items.sort((a, b) => {
                const pA = priority[a.status] || 99;
                const pB = priority[b.status] || 99;
                return pA - pB;
            });
        }

        // 儲存資料到 LocalStorage
        function saveData() {
            localStorage.setItem('typhoon_title', state.title);
            localStorage.setItem('typhoon_items', JSON.stringify(state.items));
            
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            document.getElementById('saveTimeTag').innerText = `最近更新時間：${timeStr}`;
        }

        // 關鍵字搜尋處理
        function handleSearch(query) {
            state.searchQuery = query.trim().toLowerCase();
            renderTables();
        }

        // 分頁切換
        function switchTab(tab) {
            state.currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-[#0f172a]', 'text-white', 'shadow-sm');
                btn.classList.add('bg-slate-200', 'text-slate-700');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-200', 'text-slate-700');
                activeBtn.classList.add('bg-[#0f172a]', 'text-white', 'shadow-sm');
            }

            // 更新暗色橫條標題
            const headerTitle = document.getElementById('sectionHeaderTitle');
            if (tab === 'A') headerTitle.innerText = 'A 廠商派工明細';
            else if (tab === 'B') headerTitle.innerText = 'B 廠商派工明細';
            else headerTitle.innerText = '全區派工總表';

            renderTables();
        }

        // 更新統計數據
        function updateStats() {
            const all = state.items;
            const aList = all.filter(i => i.vendor === 'A廠商');
            const bList = all.filter(i => i.vendor === 'B廠商');

            const elAll = document.getElementById('count-ALL');
            if (elAll) elAll.innerText = all.length;
            
            const elA = document.getElementById('count-A');
            if (elA) elA.innerText = aList.length;

            const elB = document.getElementById('count-B');
            if (elB) elB.innerText = bList.length;

            const displayData = getFilteredData();
            const elProc = document.getElementById('stat-processing');
            if (elProc) elProc.innerText = displayData.filter(i => i.status === '處理中').length;

            const elComp = document.getElementById('stat-completed');
            if (elComp) elComp.innerText = displayData.filter(i => i.status === '已完成').length;

            const elClosed = document.getElementById('stat-closed');
            if (elClosed) elClosed.innerText = displayData.filter(i => i.status === '銷案').length;

            const badge = document.getElementById('sectionCountBadge');
            if (badge) badge.innerText = `共 ${displayData.length} 筆紀錄`;
        }

        function saveTitle(newTitle) {
            state.title = newTitle.trim() || '基隆市七堵區薔琵颱風災害派工彙整表';
            saveData();
        }

        // 依當前 Tab 及搜尋關鍵字獲取顯示數據
        function getFilteredData() {
            let filtered = state.items;

            if (state.currentTab === 'A') {
                filtered = filtered.filter(item => item.vendor === 'A廠商');
            } else if (state.currentTab === 'B') {
                filtered = filtered.filter(item => item.vendor === 'B廠商');
            }

            if (state.searchQuery) {
                filtered = filtered.filter(item => (item.location || '').toLowerCase().includes(state.searchQuery));
            }

            return filtered;
        }

        // 渲染表格
        function renderTables() {
            const tbody = document.getElementById('dispatchTable');
            const displayData = getFilteredData();

            tbody.innerHTML = displayData.map((item, index) => {
                const isProcessing = item.status === '處理中';
                const isCompleted = item.status === '已完成';
                const isClosed = item.status === '銷案';

                let statusBadgeClass = 'bg-slate-100 text-slate-700 border-slate-300';

                if (isCompleted) statusBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-300';
                if (isClosed) statusBadgeClass = 'bg-slate-100 text-slate-500 border-slate-200 line-through';

                // 生成地圖連結 URL
                let mapUrl = item.map;
                if (!item.map.startsWith('http://') && !item.map.startsWith('https://')) {

                return `
                    <tr data-id="${item.id}" class="hover:bg-slate-50/80 transition-colors">
                        <!-- 拖曳手柄 -->

                                <option value="A廠商" ${item.vendor === 'A廠商' ? 'selected' : ''}>A廠商</option>
                                <option value="B廠商" ${item.vendor === 'B廠商' ? 'selected' : ''}>B廠商</option>
                            </select>
                        </td>
                        <!-- 案件處理進度 -->
                        <td class="py-3 px-3">
                            <select onchange="updateStatus('${item.id}', this.value)" class="border rounded-md px-2 py-1 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all ${statusBadgeClass}">
                                <option value="處理中" ${isProcessing ? 'selected' : ''}>處理中</option>
                                <option value="已完成" ${isCompleted ? 'selected' : ''}>已完成</option>
                                <option value="銷案" ${isClosed ? 'selected' : ''}>銷案</option>

                            <textarea onchange="updateLocation('${item.id}', this.value)" oninput="this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';" placeholder="輸入派工地點敘述" rows="1" class="print-expand w-full bg-transparent hover:bg-white focus:bg-white border border-transparent focus:border-slate-300 rounded px-2 py-1 text-slate-900 text-sm focus:outline-none resize-none overflow-hidden whitespace-pre-wrap break-all leading-relaxed transition-all">${item.location}</textarea>
                        </td>
                        <!-- Google Map 欄位 -->
                        <td class="py-3 px-3">
                            <div class="flex flex-col gap-1">
                                <span class="text-slate-800 font-medium text-xs px-2 py-0.5 select-text break-all">${item.map}</span>
                                <a href="${mapUrl}" target="_blank" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 text-xs hover:underline font-medium px-2">
                                    <i class="fa-solid fa-location-dot"></i> 開啟地圖
                                </a>
                            </div>
                        </td>
                        <!-- 現況照片 -->
                        <td class="py-3 px-3">
                            ${renderPhotoCell(item.id, 'before', item.beforePhotos)}
                        </td>
                        <!-- 完成照片 -->
                        <td class="py-3 px-3">
                            ${renderPhotoCell(item.id, 'after', item.afterPhotos)}
                        </td>
                        <!-- 操作 (刪除按鈕) -->
                        <td class="py-3 px-3 text-center no-print">
                            <button onclick="deleteRecord('${item.id}')" class="text-slate-400 hover:text-red-600 p-1.5 rounded transition-colors" title="刪除此列">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            // 自動調整所有 textarea 的高度以完整顯示文字
            requestAnimationFrame(() => {
                const textareas = tbody.querySelectorAll('textarea');
                textareas.forEach(ta => {
                    ta.style.height = 'auto';
                    ta.style.height = (ta.scrollHeight) + 'px';
                });
            });

            updateStats();
            initSortable();
        }

        // 渲染照片欄位元件
        function renderPhotoCell(id, type, photos) {
            const photoList = photos || [];
            return `
                <div class="flex flex-col gap-2">
                    <div class="flex flex-wrap gap-1.5 items-center">
                        ${photoList.map((imgUrl, pIdx) => `
                            <div class="relative group w-12 h-12 border border-slate-200 rounded overflow-hidden bg-slate-100 flex-shrink-0">
                                <img src="${imgUrl}" class="w-full h-full object-cover" />
                                <button onclick="deletePhoto('${id}', '${type}', ${pIdx})" class="photo-del-btn absolute top-0 right-0 bg-red-600 text-white w-4 h-4 rounded-bl flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition-opacity" title="刪除照片">
                                    ✕
                                </button>
                            </div>
                        `).join('')}
                    </div>
                    <label class="no-print inline-flex items-center justify-center gap-1 px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs cursor-pointer border border-slate-200 transition-all w-fit">
                        <i class="fa-solid fa-camera"></i> 上傳照片
                        <input type="file" multiple accept="image/*" class="hidden" onchange="uploadPhotos('${id}', '${type}', event)">
                    </label>
                </div>
            `;
        }

        // 照片上傳處理 (支援多張)
        function uploadPhotos(id, type, event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            const item = state.items.find(i => i.id === id);
            if (!item) return;

            let loaded = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    if (type === 'before') {
                        item.beforePhotos = item.beforePhotos || [];
                        item.beforePhotos.push(dataUrl);
                    } else {
                        item.afterPhotos = item.afterPhotos || [];
                        item.afterPhotos.push(dataUrl);
                    }
                    loaded++;
                    if (loaded === files.length) {
                        saveData();
                        renderTables();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // 刪除單張照片
        function deletePhoto(id, type, pIdx) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            if (type === 'before' && item.beforePhotos) {
                item.beforePhotos.splice(pIdx, 1);
            } else if (type === 'after' && item.afterPhotos) {
                item.afterPhotos.splice(pIdx, 1);
            }
            saveData();
            renderTables();
        }

        // 欄位更動事件 handler
        function updateVendor(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.vendor = val; saveData(); updateStats(); }
        }

        function updateStatus(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { 
                item.status = val; 
                sortDataByStatus();
                saveData(); 
                renderTables(); 
            }
        }

        function updateLocation(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.location = val; saveData(); }
        }

        function updateMap(id, val) {
            const item = state.items.find(i => i.id === id);
            if (item) { item.map = val; saveData(); renderTables(); }
        }

        function deleteRecord(id) {
            if (confirm('確定要刪除這筆派工紀錄嗎？')) {
                state.items = state.items.filter(i => i.id !== id);
                saveData();
                renderTables();
            }
        }

        function addNewRecord() {
            const newId = 'new-' + Date.now();
            const newItem = {
                id: newId,
                vendor: state.currentTab === 'A' ? 'A廠商' : 'B廠商',
                status: '處理中',
                location: '新派工地點',
                map: '基隆市七堵區',
                beforePhotos: [],
                afterPhotos: []
            };
            state.items.unshift(newItem);
            saveData();
            renderTables();
        }

        // 初始化拖曳排序
        function initSortable() {
            const tbody = document.getElementById('dispatchTable');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(tbody, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function(evt) {
                    const displayData = getFilteredData();
                    const movedItem = displayData[evt.oldIndex];
                    displayData.splice(evt.oldIndex, 1);
                    displayData.splice(evt.newIndex, 0, movedItem);

                    if (state.currentTab === 'ALL' && !state.searchQuery) {
                        state.items = displayData;
                    } else {
                        // 在篩選狀態下更新排序邏輯
                        const displayIds = new Set(displayData.map(i => i.id));
                        const otherItems = state.items.filter(i => !displayIds.has(i.id));
                        state.items = [...displayData, ...otherItems];
                    }
                    saveData();
                    renderTables();
                }
            });
        }

        // 匯出 Excel (包含 全區總表/A廠商/B廠商 三個工作表)
        function exportToExcel() {
            const wb = XLSX.utils.book_new();

            const createSheetData = (items) => {
                const headers = ['序號', '廠商', '案件處理進度', '派工地點', 'Google Map地圖位置', '現況照片', '完成照片'];
                const rows = items.map((item, idx) => {
                    let mapUrl = item.map;
                    if (!item.map.startsWith('http://') && !item.map.startsWith('https://')) {
                        mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}`;
                    }
                    return [
                        idx + 1,
                        item.vendor,
                        item.status,
                        item.location,
                        { f: `HYPERLINK("${mapUrl}", "${item.map}")` },
                        item.beforePhotos && item.beforePhotos.length ? `[已上傳 ${item.beforePhotos.length} 張]` : '',
                        item.afterPhotos && item.afterPhotos.length ? `[已上傳 ${item.afterPhotos.length} 張]` : ''
                    ];
                });
                return [headers, ...rows];
            };

            const allWs = XLSX.utils.aoa_to_sheet(createSheetData(state.items));
            const aWs = XLSX.utils.aoa_to_sheet(createSheetData(state.items.filter(i => i.vendor === 'A廠商')));
            const bWs = XLSX.utils.aoa_to_sheet(createSheetData(state.items.filter(i => i.vendor === 'B廠商')));

            const colWidths = [{ wch: 6 }, { wch: 10 }, { wch: 14 }, { wch: 45 }, { wch: 35 }, { wch: 16 }, { wch: 16 }];
            allWs['!cols'] = colWidths;
            aWs['!cols'] = colWidths;
            bWs['!cols'] = colWidths;

            XLSX.utils.book_append_sheet(wb, allWs, '全區派工總表');
            XLSX.utils.book_append_sheet(wb, aWs, 'A廠商');
            XLSX.utils.book_append_sheet(wb, bWs, 'B廠商');

            XLSX.writeFile(wb, `${state.title}.xlsx`);
        }

        // 上傳 Excel 匯入檔案更新網頁內容
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    // 設定 cellFormula/cellText 等以完整抓取公式與超連結 content
                    const workbook = XLSX.read(data, { type: 'array', cellFormula: true, cellHTML: true, cellStyles: true });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });

                    if (jsonData.length < 2) {
                        alert('無效的 Excel 內容');
                        return;
                    }

                    const newItems = [];
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length === 0) continue;

                        // 取出地圖欄位 (索引 4) 精確解析：支援 Hyperlink 標籤、HYPERLINK 公式、純文字位址與座標
                        let mapVal = '';
                        const cellAddress = XLSX.utils.encode_cell({ r: i, c: 4 });
                        const cell = worksheet[cellAddress];

                        if (cell) {
                            // 1. 優先檢查是否為 Excel Native 儲存格超連結對象
                            if (cell.l && cell.l.Target) {
                                mapVal = cell.l.Target;
                            } 
                            // 2. 若為 HYPERLINK("url", "text") 公式，解析公式中的 URL 或文字
                            else if (cell.f && cell.f.includes('HYPERLINK')) {
                                const match = cell.f.match(/HYPERLINK\s*\(\s*"([^"]+)"(?:\s*,\s*"([^"]+)")?\s*\)/i);
                                if (match) {
                                    mapVal = match[2] || match[1] || '';
                                }
                            }
                            
                            // 3. 取單元格顯示值或內容 (支援填寫座標如 "25.101,121.710" 或實際地址)
                            if (!mapVal) {
                                mapVal = cell.w ? String(cell.w).trim() : (cell.v !== undefined ? String(cell.v).trim() : '');
                            }
                        }

                        // 4. Fallback: 取 row 陣列的值
                        if (!mapVal && row[4] !== undefined && row[4] !== null) {
                            mapVal = String(row[4]).trim();
                        }

                        newItems.push({
                            id: 'imp-' + Date.now() + '-' + i,
                            vendor: row[1] ? String(row[1]).trim() : 'B廠商',
                            status: row[2] ? String(row[2]).trim() : '處理中',
                            location: row[3] ? String(row[3]).trim() : '',
                            map: mapVal || '',
                            beforePhotos: [],
                            afterPhotos: []
                        });
                    }

                    if (newItems.length > 0) {
                        state.items = newItems;
                        sortDataByStatus();
                        saveData();
                        renderTables();
                        alert(`成功匯入 ${newItems.length} 筆案件！`);
                    }
                } catch (err) {
                    alert('讀取 Excel 檔案失敗，請檢查檔案格式。');
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
